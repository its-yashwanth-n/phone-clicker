# Builds Phone Clicker for Windows, macOS and Linux.
# Push a version tag (e.g. `git tag v1.0.0 && git push origin v1.0.0`) to publish a GitHub Release
# with the installers attached. Running it by hand from the Actions tab just builds the files.

name: Build and release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
          - os: macos-latest
          # Older Ubuntu so the Linux build runs on more distros.
          - os: ubuntu-22.04
    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-build.txt

      - name: Read version
        id: version
        shell: bash
        run: echo "version=$(sed -n 's/^__version__ = "\(.*\)"/\1/p' server.py)" >> "$GITHUB_OUTPUT"

      - name: Build app
        run: pyinstaller --noconfirm packaging/phone-clicker.spec

      - name: Package for Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) { choco install innosetup -y --no-progress }
          & $iscc "/DAppVersion=${{ steps.version.outputs.version }}" packaging\windows\installer.iss
          Compress-Archive -Path dist\PhoneClicker\* -DestinationPath "dist\PhoneClicker-${{ steps.version.outputs.version }}-windows-portable.zip"

      - name: Package for macOS
        if: runner.os == 'macOS'
        run: |
          mkdir dmg
          cp -R "dist/Phone Clicker.app" dmg/
          ln -s /Applications dmg/Applications
          hdiutil create -volname "Phone Clicker" -srcfolder dmg -ov -format UDZO \
            "dist/PhoneClicker-${{ steps.version.outputs.version }}-macos-apple-silicon.dmg"

      - name: Package for Linux
        if: runner.os == 'Linux'
        run: tar -czf "dist/PhoneClicker-${{ steps.version.outputs.version }}-linux-x64.tar.gz" -C dist PhoneClicker

      - uses: actions/upload-artifact@v4
        with:
          name: phone-clicker-${{ runner.os }}
          if-no-files-found: error
          path: |
            dist/*.exe
            dist/*.zip
            dist/*.dmg
            dist/*.tar.gz

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: release
          merge-multiple: true

      - uses: softprops/action-gh-release@v2
        with:
          files: release/*
          generate_release_notes: true
