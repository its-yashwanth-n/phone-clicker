<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Phone Clicker</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect x='8' y='2' width='16' height='28' rx='4' fill='%234f7cff'/%3E%3Cpath d='M14 11l5 5-5 5' stroke='white' stroke-width='2.5' fill='none' stroke-linecap='round'/%3E%3C/svg%3E">
  <style>
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #111318;
      color: #eef0f4;
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    }
    .card { text-align: center; max-width: 520px; padding: 24px; }
    .qr { background: #fff; padding: 20px; border-radius: 20px; display: inline-block; }
    .qr svg { width: 300px; height: 300px; display: block; }
    code { display: block; margin-top: 16px; color: #8a90a0; word-break: break-all; }
    ol { text-align: left; color: #c5c9d3; line-height: 1.7; }
    button {
      margin-top: 8px;
      background: transparent;
      color: #ff5a5a;
      border: 1px solid #3a2a2e;
      border-radius: 12px;
      padding: 10px 18px;
      font: inherit;
      cursor: pointer;
    }
    button:hover { background: #2a1d21; }
  </style>
</head>
<body>
  <div class="card">
    <h1>Scan with your phone</h1>
    <div class="qr">{{QR}}</div>
    <code>{{URL}}</code>
    <ol>
      <li>Phone and laptop must be on the same Wi-Fi.</li>
      <li>Open your presentation or PDF and click on it so it has focus.</li>
      <li>Pick the app on your phone, tap <b>Start</b>, then tap <b>NEXT</b>.</li>
    </ol>
    <button id="stop">Stop Phone Clicker</button>
  </div>
  <script>
    document.getElementById("stop").addEventListener("click", async () => {
      await fetch("/quit", { method: "POST" }).catch(() => {});
      document.querySelector(".card").innerHTML = "<h1>Phone Clicker stopped</h1><p>You can close this tab.</p>";
    });
  </script>
</body>
</html>
